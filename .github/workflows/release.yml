# =============================================================================
#  .github/workflows/release.yml
#  On push to main: build Docker image, push to GHCR, create GitHub release.
#  Only runs after CI passes.
# =============================================================================

name: Release

on:
  push:
    tags:
      - "v*.*.*"   # triggers on v1.0.0, v1.2.3, etc.

permissions:
  contents: write      # to create releases
  packages: write      # to push to GHCR

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    needs: []

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## ReachInbox Email Scheduler ${{ github.ref_name }}

            ### Quick Start
            ```bash
            git clone https://github.com/${{ github.repository }}
            cp .env.example .env  # fill in credentials
            docker-compose up -d  # start Postgres, Redis, Elasticsearch
            cd backend && pnpm install && pnpm db:migrate && pnpm dev
            cd frontend && pnpm install && pnpm dev
            ```

            See [README.md](README.md) for full setup instructions.

