services:
  # ── Backend Web API ──────────────────────────────────────────
  - type: web
    name: reachinbox-backend
    env: node
    plan: free
    region: oregon
    buildCommand: cd backend && npm install --include=dev && npx prisma generate && npm run build
    startCommand: cd backend && npx prisma migrate deploy && npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Set to your Neon PostgreSQL connection string
      - key: REDIS_URL
        sync: false # Set to your Upstash or Render Redis connection string
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false

  # ── Background Queue Worker (SMTP & Scheduler) ───────────────
  - type: worker
    name: reachinbox-worker
    env: node
    plan: free
    region: oregon
    buildCommand: cd backend && npm install --include=dev && npx prisma generate && npm run build
    startCommand: cd backend && npx prisma migrate deploy && npm run start:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false

  # ── Frontend Static Site ─────────────────────────────────────
  - type: web
    name: reachinbox-frontend
    env: static
    plan: free
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # Set to your deployed backend URL + /api (or empty if using proxy)
      - key: VITE_BACKEND_URL
        sync: false # Set to your deployed backend URL
